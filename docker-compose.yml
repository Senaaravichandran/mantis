version: "3.9"

services:
  # ============================================================
  # PostgreSQL + TimescaleDB + PostGIS
  # ============================================================
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: mantis-postgres
    environment:
      POSTGRES_DB: mantis
      POSTGRES_USER: mantis
      POSTGRES_PASSWORD: mantis_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./services/api/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mantis -d mantis"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: mantis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Apache Kafka + Zookeeper
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: mantis-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: mantis-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ============================================================
  # Qdrant (Vector Database)
  # ============================================================
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: mantis-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # MinIO (S3-compatible Object Storage)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: mantis-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: mantis_minio
      MINIO_ROOT_PASSWORD: mantis_minio_secret
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Ollama (Local LLM Serving)
  # ============================================================
  ollama:
    image: ollama/ollama:latest
    container_name: mantis-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ============================================================
  # MANTIS API Service
  # ============================================================
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: mantis-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://mantis:mantis_dev_password@postgres:5432/mantis
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: mantis_minio
      MINIO_SECRET_KEY: mantis_minio_secret
      OLLAMA_BASE_URL: http://ollama:11434
      MANTIS_ENV: development
      AUTH_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # MANTIS Agent Service
  # ============================================================
  agents:
    build:
      context: .
      dockerfile: services/agents/Dockerfile
    container_name: mantis-agents
    environment:
      DATABASE_URL: postgresql+asyncpg://mantis:mantis_dev_password@postgres:5432/mantis
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3:70b-instruct-q4_K_M
      OLLAMA_FAST_MODEL: mistral:7b-instruct-v0.3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # MANTIS Ingestion Service
  # ============================================================
  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: mantis-ingestion
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql+asyncpg://mantis:mantis_dev_password@postgres:5432/mantis
      NOAA_API_BASE: https://api.weather.gov
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # MANTIS Celery Worker
  # ============================================================
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: mantis-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://mantis:mantis_dev_password@postgres:5432/mantis
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # MANTIS Celery Beat (Scheduler)
  # ============================================================
  beat:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: mantis-beat
    command: celery -A services.worker.celery_app beat --loglevel=info
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # MANTIS Web Dashboard
  # ============================================================
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: mantis-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
  qdrant-data:
  minio-data:
  ollama-data:
  kafka-data:
  zookeeper-data:

# Updated service configurations
