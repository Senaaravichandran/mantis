[project]
name = "mantis-ingestion"
version = "0.1.0"
description = "MANTIS Data Ingestion Service"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.10",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
