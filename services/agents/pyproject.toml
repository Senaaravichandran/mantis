[project]
name = "mantis-agents"
version = "0.1.0"
description = "MANTIS Agent Service - LangGraph multi-agent orchestration"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "aiokafka>=0.10",
    "qdrant-client>=1.10",
    "httpx>=0.27",
    "numpy>=1.26",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
