[project]
name = "mantis-api"
version = "0.1.0"
description = "MANTIS API Service - FastAPI REST + WebSocket"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "aiokafka>=0.10",
    "python-multipart>=0.0.9",
    "geoalchemy2>=0.15",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
